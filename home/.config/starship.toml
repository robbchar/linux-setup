"$schema" = 'https://starship.rs/config-schema.json'

# Starship's defaults are good; this only trims and tunes a few modules.
# All options: https://starship.rs/config/

add_newline = true
command_timeout = 800

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold blue"

[git_branch]
style = "bold purple"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
