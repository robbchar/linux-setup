# Fuzzel: app launcher (Super+D) and the key bindings menu (Super+/).
# Options: `man 5 fuzzel.ini`

[main]
font=JetBrainsMono Nerd Font:size=12
terminal=kitty
width=44
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
# RRGGBBAA, Catppuccin Mocha
background=1e1e2ef0
text=cdd6f4ff
match=f5c2e7ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f5c2e7ff
border=b4befeff

[border]
width=2
radius=8
